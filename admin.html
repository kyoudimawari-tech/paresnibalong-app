<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balong Admin Dashboard</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; padding: 20px; }
        header { background: #e60000; padding: 15px; text-align: center; font-weight: bold; margin-bottom: 20px; }
        .order-card { background: #111; border: 1px solid #e60000; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .btn-accept { background: green; color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<header>BALONG ADMIN DASHBOARD</header>
<div id="orders-list">Waiting for orders...</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAd6k-rNXngAhebaKosSz9yh6XfHnZpIAs",
        authDomain: "pares-ni-balong.firebaseapp.com",
        databaseURL: "https://pares-ni-balong-default-rtdb.asia-southeast1.firebasedatabase.app/",
        projectId: "pares-ni-balong",
        storageBucket: "pares-ni-balong.firebasestorage.app",
        messagingSenderId: "250075031311",
        appId: "1:250075031311:web:8c4369113ea967e51c407a"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref('orders').on('value', (snapshot) => {
        const orders = snapshot.val();
        const list = document.getElementById('orders-list');
        list.innerHTML = "";
        if(!orders) return list.innerHTML = "No orders yet.";

        for(let id in orders) {
            const o = orders[id];
            list.innerHTML += `
                <div class="order-card">
                    <h3>ID: ${id}</h3>
                    <p><b>Customer:</b> ${o.name}</p>
                    <p><b>Total:</b> ₱${o.total}</p>
                    <p><b>Ref No:</b> ${o.ref}</p>
                    <p><b>Status:</b> ${o.status}</p>
                    ${o.status === 'pending' ? `<button class="btn-accept" onclick="accept('${id}')">ACCEPT ORDER</button>` : ''}
                </div>`;
        }
    });

    function accept(id) {
        db.ref('orders/' + id).update({ status: 'accepted' });
    }
</script>
</body>
</html>
