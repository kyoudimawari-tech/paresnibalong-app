<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balong Smart Admin | Orders Dashboard</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        :root { --red: #e60000; --green: #4caf50; --black: #000000; --card: #1a1a1a; }
        body { background: var(--black); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        header { background: var(--red); padding: 15px; text-align: center; font-weight: bold; font-size: 1.2rem; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .container { padding: 10px; max-width: 600px; margin: auto; }
        .order-card { background: var(--card); margin-bottom: 15px; padding: 15px; border-radius: 12px; border-left: 6px solid yellow; position: relative; }
        .order-card.accepted { border-left-color: var(--green); opacity: 0.8; }
        .order-id { font-size: 0.7rem; color: #888; margin-bottom: 5px; }
        .cust-info { font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .items-list { background: #000; padding: 10px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 10px; border: 1px solid #333; }
        .combo-tag { color: #ffeb3b; font-size: 0.85rem; font-style: italic; margin-top: 5px; display: block; }
        .total-price { color: var(--green); font-weight: bold; font-size: 1.2rem; }
        .delivery-tag { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; background: #333; margin-top: 5px; }
        .btn-accept { background: var(--green); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 10px; font-size: 1rem; }
        .btn-call { background: #03a9f4; color: white; text-decoration: none; padding: 8px; border-radius: 5px; font-size: 0.8rem; display: inline-block; margin-top: 10px; }
        .status-label { font-size: 0.7rem; padding: 2px 6px; border-radius: 3px; text-transform: uppercase; }
    </style>
</head>
<body>

<header>🔴 BALONG SMART ADMIN</header>

<div class="container" id="admin-list">
    <p style="text-align:center; margin-top:50px; color:#555;">Connecting to database...</p>
</div>

<script>
    // DAPAT PAREHO ITO SA INDEX.HTML
    const firebaseConfig = {
        apiKey: "AIzaSyBEkhDhIFcCltfr13S8XkZptaxxCjK_OMs",
        authDomain: "pares-ni-balong-749a0.firebaseapp.com",
        databaseURL: "https://pares-ni-balong-749a0-default-rtdb.firebaseio.com/",
        projectId: "pares-ni-balong-749a0",
        storageBucket: "pares-ni-balong-749a0.firebasestorage.app",
        messagingSenderId: "713855678812",
        appId: "1:713855678812:web:1d943775f953cf3d336999"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Pakikinig sa database (Real-time)
    db.ref('orders').orderByChild('timestamp').on('value', snapshot => {
        const listArea = document.getElementById('admin-list');
        listArea.innerHTML = "";
        
        if (!snapshot.exists()) {
            listArea.innerHTML = "<p style='text-align:center; margin-top:50px; color:#555;'>No orders yet. Waiting...</p>";
            return;
        }

        let orders = [];
        snapshot.forEach(child => {
            orders.push({ id: child.key, ...child.val() });
        });

        // Pinakabago ang nasa itaas
        orders.reverse().forEach(order => {
            // Pag-filter ng items na may quantity
            let itemsHtml = "";
            for(let name in order.items) {
                if(order.items[name] > 0) {
                    itemsHtml += `<div>• ${order.items[name]}x ${name}</div>`;
                }
            }

            // Pag-display ng combo selections (Liempo + Bangus)
            let comboHtml = "";
            if(order.combos && order.combos.length > 0) {
                order.combos.forEach(c => {
                    comboHtml += `<span class="combo-tag">└─ Combo: ${c}</span>`;
                });
            }

            const card = document.createElement('div');
            card.className = `order-card ${order.status}`;
            card.innerHTML = `
                <div class="order-id">ID: ${order.id} | ${new Date(order.timestamp).toLocaleTimeString()}</div>
                <div class="cust-info">
                    <span>${order.name}</span>
                    <span class="status-label" style="background:${order.status === 'pending' ? 'yellow' : 'var(--green)'}; color:#000;">
                        ${order.status}
                    </span>
                </div>
                
                <div class="items-list">
                    ${itemsHtml}
                    ${comboHtml}
                </div>

                <div style="display:flex; justify-content:space-between; align-items:flex-end;">
                    <div>
                        <div class="total-price">₱${order.total}</div>
                        <div class="delivery-tag">🚚 ${order.method}</div>
                        <br>
                        <div style="font-size:0.8rem; color:#aaa; margin-top:5px;">Ref: ${order.ref}</div>
                    </div>
                    <a href="tel:${order.phone}" class="btn-call">📞 CALL</a>
                </div>

                ${order.status === 'pending' ? 
                    `<button class="btn-accept" onclick="acceptOrder('${order.id}')">ACCEPT & COOK</button>` : 
                    `<div style="text-align:center; color:var(--green); margin-top:10px; font-weight:bold;">✓ ORDER ACCEPTED</div>`
                }
            `;
            listArea.appendChild(card);
        });
    });

    function acceptOrder(id) {
        if(confirm("Lulutuin na ba ito? Magno-notify din sa customer.")) {
            db.ref('orders/' + id).update({ status: 'accepted' })
            .catch(err => alert("Error: " + err.message));
        }
    }
</script>
</body>
</html>
