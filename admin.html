<!DOCTYPE html>
<html>
<head>
    <title>Balong Smart Admin</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; }
        header { background: #e60000; padding: 15px; text-align: center; font-weight: bold; font-size: 1.2rem; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .order-card { background: #1a1a1a; margin: 15px; padding: 15px; border-radius: 12px; border-left: 6px solid #e60000; transition: 0.3s; }
        .pending { border-left-color: #ffc107; }
        .accepted { border-left-color: #4caf50; opacity: 0.8; }
        .btn-accept { background: #4caf50; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .combo-info { color: #ffeb3b; font-size: 0.85rem; background: #222; padding: 8px; margin: 5px 0; border-radius: 6px; font-style: italic; }
        .meta-info { font-size: 0.8rem; color: #aaa; margin-top: 10px; border-top: 1px solid #333; padding-top: 10px; }
    </style>
</head>
<body>

<header>🔴 BALONG SMART ADMIN</header>
<div id="admin-list">
    <p style="text-align:center; margin-top:50px; color:#555;">Waiting for new orders...</p>
</div>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyBEkhDhIFcCltfr13S8XkZptaxxCjK_OMs", 
        authDomain: "pares-ni-balong-749a0.firebaseapp.com", 
        databaseURL: "https://pares-ni-balong-749a0-default-rtdb.firebaseio.com", 
        projectId: "pares-ni-balong-749a0", 
        storageBucket: "pares-ni-balong-749a0.firebasestorage.app", 
        messagingSenderId: "713855678812", 
        appId: "1:713855678812:web:44d46c08dd9dca1c336999" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref('orders').orderByChild('timestamp').on('value', snapshot => {
        const list = document.getElementById('admin-list');
        list.innerHTML = "";
        
        let ordersArray = [];
        snapshot.forEach(child => {
            ordersArray.push({ id: child.key, ...child.val() });
        });

        // Pakita ang pinakabago sa taas
        ordersArray.reverse().forEach(order => {
            let itemsHtml = "";
            for(let key in order.items) {
                if(order.items[key] > 0) itemsHtml += `<div style="display:flex; justify-content:space-between;"><span>${order.items[key]}x ${key}</span></div>`;
            }

            let comboHtml = "";
            if(order.combos) {
                order.combos.forEach(c => {
                    comboHtml += `<div class="combo-info">└─ ${c}</div>`;
                });
            }

            list.innerHTML += `
                <div class="order-card ${order.status}">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <b style="font-size:1.1rem;">${order.name}</b>
                        <span style="background:${order.status === 'pending' ? '#ffc107' : '#4caf50'}; color:#000; padding:2px 8px; border-radius:4px; font-size:0.7rem; font-weight:bold;">
                            ${order.status.toUpperCase()}
                        </span>
                    </div>
                    <div style="margin:10px 0;">
                        ${itemsHtml}
                        ${comboHtml}
                    </div>
                    <div style="color:#4caf50; font-weight:bold; font-size:1.2rem;">Total: ₱${order.total}</div>
                    
                    <div class="meta-info">
                        Ref: <span style="color:#fff;">${order.ref}</span> | Method: <span style="color:#fff;">${order.method}</span><br>
                        <a href="tel:${order.phone}" style="color:#03a9f4; text-decoration:none; display:inline-block; margin-top:8px;">📞 Call Customer: ${order.phone}</a>
                    </div>

                    ${order.status === 'pending' ? `<button class="btn-accept" onclick="acceptOrder('${order.id}')">ACCEPT ORDER</button>` : ''}
                </div>
            `;
        });
    });

    function acceptOrder(id) {
        if(confirm("Lulutuin na ba ito?")) {
            db.ref('orders/' + id).update({ status: "accepted" });
        }
    }
</script>
</body>
</html>
