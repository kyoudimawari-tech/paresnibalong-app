<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balong Admin Dashboard</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; padding: 10px; }
        header { background: #e60000; padding: 15px; text-align: center; font-weight: bold; position: sticky; top: 0; }
        .order-card { background: #1a1a1a; margin: 10px 0; padding: 15px; border-radius: 10px; border-left: 5px solid yellow; }
        .order-card.accepted { border-left-color: #4caf50; opacity: 0.8; }
        .btn { background: #4caf50; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<header>🔴 BALONG ADMIN DASHBOARD</header>
<div id="admin-list"></div>

<script>
    const firebaseConfig = {
    apiKey: "AIzaSyBEkhDhIFcCltfr13S8XkZptaxxCjK_OMs",
    authDomain: "pares-ni-balong-749a0.firebaseapp.com",
    // Ito ang saktong URL base sa screenshot mo
    databaseURL: "https://pares-ni-balong-default-rtdb.asia-southeast1.firebasedatabase.app/",
    projectId: "pares-ni-balong-749a0",
    storageBucket: "pares-ni-balong-749a0.firebasestorage.app",
    messagingSenderId: "713855678812",
    appId: "1:713855678812:web:1d943775f953cf3d336999"
};
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref('orders').orderByChild('timestamp').on('value', snapshot => {
        const list = document.getElementById('admin-list');
        list.innerHTML = "";
        snapshot.forEach(child => {
            const o = child.val();
            let itemsStr = "";
            for(let name in o.items) if(o.items[name] > 0) itemsStr += `<div>${o.items[name]}x ${name}</div>`;
            
            list.innerHTML = `
                <div class="order-card ${o.status}">
                    <b>${o.name}</b> (${o.phone})<br>
                    <div style="color:yellow; margin:8px 0;">${itemsStr} ${o.combos ? '<br>'+o.combos.join(', ') : ''}</div>
                    <div style="font-weight:bold;">Total: ₱${o.total}</div>
                    <div style="font-size:0.8rem; color:#888;">${o.method} | Ref: ${o.ref}</div>
                    ${o.status === 'pending' ? `<button class="btn" onclick="accept('${child.key}')">ACCEPT ORDER</button>` : '<div style="color:green; margin-top:10px;">ACCEPTED</div>'}
                </div>
            ` + list.innerHTML;
        });
    });

    function accept(id) { db.ref('orders/' + id).update({ status: 'accepted' }); }
</script>
</body>
</html>
