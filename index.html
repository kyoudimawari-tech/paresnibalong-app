<!DOCTYPE html>
<html>
<head>
    <title>Pares ni Balong - Payment Verification</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f4f4f4; }
        .form-container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { background-color: #28a745; color: white; padding: 15px; border: none; width: 100%; border-radius: 5px; font-size: 16px; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Pares ni Balong 🍲</h2>
        <p>I-submit ang detalye ng iyong bayad:</p>
        
        <form action="https://formspree.io/f/YOUR_FORMSPREE_ID" method="POST">
            <input type="text" name="name" placeholder="Pangalan ng Customer" required>
            <input type="number" name="amount" placeholder="Magkano ang binayad (Amount)" required>
            <input type="text" name="ref_no" placeholder="GCash Reference No." required>
            
            <p style="font-size: 12px; color: gray;">Siguraduhing tama ang Ref No. para sa mabilis na verification.</p>
            <button type="submit">I-verify ang Bayad</button>
        </form>
    </div>
</body>
</html>
