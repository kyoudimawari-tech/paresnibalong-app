<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pares Ni Balong | Live Ordering</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        :root { --gold: #ffcc00; --red: #ff3131; --bg: #121212; --card: #1e1e1e; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; transition: 0.3s; }
        body { background-color: var(--bg); color: white; margin: 0; padding: 10px; }
        .container { max-width: 500px; margin: auto; background: var(--card); padding: 20px; border-radius: 25px; border: 2px solid var(--gold); }
        h2 { color: var(--gold); text-align: center; text-transform: uppercase; margin: 0; }
        #status-bar { font-size: 0.75rem; text-align: center; padding: 10px; border-radius: 10px; margin: 15px 0; border: 1px solid var(--gold); }
        .category-label { background: #333; color: var(--gold); padding: 8px; font-weight: bold; margin: 15px 0 10px 0; border-radius: 5px; font-size: 0.8rem; text-align: center; }
        .menu-item { display: flex; justify-content: space-between; align-items: center; background: #262626; padding: 12px; border-radius: 12px; margin-bottom: 8px; border-left: 5px solid var(--red); }
        .qty-ctrl { display: flex; align-items: center; gap: 8px; }
        .q-btn { width: 32px; height: 32px; border: none; background: var(--gold); font-weight: bold; border-radius: 8px; cursor: pointer; }
        .btn { width: 100%; padding: 15px; margin-top: 10px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .btn-gold { background: var(--gold); color: #000; }
        .step { display: none; } .active { display: block; }
        input, select { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; background: #000; color: white; border: 1px solid #444; }
    </style>
</head>
<body onload="autoDetect()">

<div class="container">
    <h2>PARES NI BALONG</h2>
    
    <div id="status-bar">🛰️ Initializing GPS...</div>

    <div id="s1" class="step active">
        <div id="menu-list" style="max-height: 50vh; overflow-y: auto;"></div>
        
        <div style="background:#262626; padding:15px; border-radius:12px; margin-top:15px; border: 1px solid var(--gold);">
            <div style="display:flex; justify-content:space-between; font-size: 0.85rem;">
                <span>Delivery Fee (₱20+₱5/km):</span>
                <span id="fee-display">₱0.00</span>
            </div>
            <div style="display:flex; justify-content:space-between; font-weight:bold; color:var(--gold); font-size:1.3rem; margin-top:5px;">
                <span>TOTAL:</span><span>₱<span id="final-total">0.00</span></span>
            </div>
        </div>
        <button class="btn btn-gold" id="btn-next" onclick="nav('s2')" disabled style="opacity:0.5;">WAITING FOR GPS...</button>
    </div>

    <div id="s2" class="step">
        <h4 style="color:var(--gold); text-align:center;">GCASH PAYMENT</h4>
        <div style="background:#fff; color:#000; padding:15px; border-radius:15px; text-align:center; font-weight:bold; margin-bottom:15px;">
            GCASH: 09XX XXX XXXX (BALONG)
        </div>
        <input type="text" id="ref-no" placeholder="13-Digit GCash Ref No." maxlength="13">
        <input type="file" id="receipt" accept="image/*" style="margin-top:10px;">
        <button class="btn btn-gold" onclick="sendOrder()">SEND TO BALONG</button>
        <button class="btn" style="background:#333; color:white;" onclick="nav('s1')">BACK</button>
    </div>

    <div id="s3" class="step">
        <div style="text-align:center; padding:40px 0;">
            <div id="status-icon" style="font-size:4rem;">⏳</div>
            <h3 id="status-title" style="color:var(--gold);">ORDER SENT</h3>
            <p id="status-msg">Wait lang, Balong is checking your payment.</p>
        </div>
    </div>
</div>

<script>
    // BALONG'S SHOP COORDINATES
    const shopX = 14.7176, shopY = 121.0501;
    let dist = 0, dFee = 0, sub = 0, cart = {};
    const orderID = "PB-" + Math.floor(1000 + Math.random()*9000);

    const firebaseConfig = { apiKey: "AIzaSyBEkhDhIFcCltfr13S8XkZptaxxCjK_OMs", authDomain: "pares-ni-balong-749a0.firebaseapp.com", databaseURL: "https://pares-ni-balong-749a0-default-rtdb.firebaseio.com", projectId: "pares-ni-balong-749a0", storageBucket: "pares-ni-balong-749a0.firebasestorage.app", messagingSenderId: "713855678812", appId: "1:713855678812:web:44d46c08dd9dca1c336999" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const menu = {
        "BEST SELLERS": { "Pares w/ Rice": 85, "Beef Mami With Rice": 60, "Lechon Pares Overload": 189 },
        "SILOG MEALS": { "Lechon Silog": 129, "Liempo Silog": 129, "Chicken Silog": 129 },
        "ADD-ONS": { "Garlic Rice": 15, "Extra Egg": 20, "Softdrinks": 25 }
    };

    function autoDetect() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(p => {
                const uX = p.coords.latitude, uY = p.coords.longitude;
                const R = 6371;
                const dLat = (uX-shopX)*Math.PI/180, dLon = (uY-shopY)*Math.PI/180;
                const a = Math.sin(dLat/2)**2 + Math.cos(shopX*Math.PI/180)*Math.cos(uX*Math.PI/180)*Math.sin(dLon/2)**2;
                dist = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                dFee = 20 + (5 * Math.ceil(dist));
                
                document.getElementById('status-bar').innerHTML = `📍 <b>${dist.toFixed(2)}km</b> mula sa shop. Fee: ₱${dFee.toFixed(2)}`;
                document.getElementById('btn-next').disabled = false;
                document.getElementById('btn-next').style.opacity = "1";
                document.getElementById('btn-next').innerText = "PROCEED TO PAYMENT ➔";
                initMenu();
            }, () => { alert("Please enable GPS to order."); });
        }
    }

    function initMenu() {
        const cont = document.getElementById('menu-list');
        for(let c in menu) {
            cont.innerHTML += `<div class="category-label">${c}</div>`;
            for(let i in menu[c]) {
                cart[i] = 0;
                cont.innerHTML += `<div class="menu-item"><span>${i}<br>₱${menu[c][i]}</span><div class="qty-ctrl"><button class="q-btn" onclick="upd('${i}',-1)">-</button><span id="q-${i.replace(/\s/g,'')}">0</span><button class="q-btn" onclick="upd('${i}',1)">+</button></div></div>`;
            }
        }
    }

    function upd(i,v) { if(cart[i]+v>=0){ cart[i]+=v; document.getElementById('q-'+i.replace(/\s/g,'')).innerText=cart[i]; calc(); } }
    function calc() {
        sub = 0; for(let c in menu) for(let i in menu[c]) sub += cart[i]*menu[c][i];
        document.getElementById('fee-display').innerText = "₱" + dFee.toFixed(2);
        document.getElementById('final-total').innerText = (sub + dFee).toFixed(2);
    }

    function nav(id) { document.querySelectorAll('.step').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }

    function sendOrder() {
        const ref = document.getElementById('ref-no').value;
        if(ref.length < 10) return alert("Invalid Ref No.");
        nav('s3');
        let items = ""; for(let i in cart) if(cart[i]>0) items += `${i}(${cart[i]}) `;
        db.ref('orders/'+orderID).set({ orderID, items, total: (sub+dFee).toFixed(2), dist: dist.toFixed(2), ref, status: "pending" });
    }
</script>
</body>
</html>
