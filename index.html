<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pares Ni Balong | Ordering System</title>
    <style>
        :root { --red: #e60000; --black: #000000; --white: #ffffff; }
        body { background: var(--black); color: var(--white); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        .container { max-width: 480px; margin: auto; padding: 15px; }
        header { background: var(--red); padding: 15px; text-align: center; font-weight: bold; position: sticky; top: 0; z-index: 10; }
        .cat-label { background: var(--red); color: white; font-weight: bold; font-size: 0.8rem; margin: 15px 0 8px 0; padding: 6px 12px; border-radius: 4px; display: inline-block; }
        .item { display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; padding: 12px; border-radius: 10px; margin-bottom: 8px; border: 1px solid #333; }
        .qty-btn { background: var(--red); border: none; width: 35px; height: 35px; border-radius: 8px; color: white; cursor: pointer; font-size: 1.2rem; }
        input { width: 100%; padding: 14px; margin-top: 10px; border-radius: 8px; background: #1a1a1a; color: white; border: 1px solid #444; box-sizing: border-box; }
        .btn { width: 100%; padding: 16px; background: var(--red); border: none; border-radius: 10px; font-weight: bold; color: white; cursor: pointer; margin-top: 10px; }
        .step { display: none; } .active { display: block; }
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #121212; width: 90%; max-width: 400px; padding: 20px; border-radius: 15px; border: 2px solid var(--red); }
        .delivery-box { background: #222; border: 1px solid var(--red); margin-bottom: 8px; text-transform: uppercase; }
    </style>
</head>
<body onload="detectGPS()">

<header>🔴 PARES NI BALONG</header>

<div class="container">
    <div id="status-bar" style="text-align:center; font-size:0.8rem; color:#aaa; margin-bottom:10px;">📍 Initializing GPS...</div>

    <div id="s1" class="step active">
        <input type="text" id="cust-name" placeholder="Full Name (Required)">
        <input type="tel" id="cust-phone" placeholder="Mobile Number" maxlength="11">
        
        <div id="menu-area" style="max-height: 55vh; overflow-y: auto; margin-top: 15px;"></div>
        
        <div style="background:#000; padding:15px; border-radius:12px; margin-top:15px; border-top:2px solid var(--red);">
            <div style="display:flex; justify-content:space-between; color:#aaa;"><span>Fee:</span> <span id="fee">₱0.00</span></div>
            <div style="display:flex; justify-content:space-between; font-weight:bold; color:var(--red); font-size:1.4rem;"><span>TOTAL:</span> <span>₱<span id="total">0.00</span></span></div>
            <button class="btn" onclick="showReview()">REVIEW ORDER</button>
        </div>
    </div>

    <div id="s2" class="step">
        <h3 style="text-align:center;">GCASH PAYMENT</h3>
        <div style="background:#fff; color:#000; padding:15px; border-radius:10px; text-align:center; font-weight:bold;">SEND TO: 09XX XXX XXXX<br>NAME: BALONG</div>
        <input type="text" id="ref-no" placeholder="Enter 13-Digit Ref No." maxlength="13">
        <input type="file" id="receipt-file" accept="image/*" style="padding:10px;">
        <button class="btn" onclick="startAIScan()">VERIFY & PLACE ORDER</button>
    </div>

    <div id="s3" class="step" style="text-align:center; padding:60px 0;">
        <h3 id="ai-title">AI SCANNING...</h3>
        <p id="ai-desc">Verifying your receipt. Please wait.</p>
    </div>
</div>

<div id="modal">
    <div class="modal-content">
        <h3 style="color:var(--red); text-align:center; margin-top:0;">ORDER SUMMARY</h3>
        <div id="summary-list" style="max-height:200px; overflow-y:auto; font-size:0.9rem; margin-bottom:10px;"></div>
        <div id="summary-total" style="text-align:right; font-weight:bold; font-size:1.2rem; color:var(--red); margin-bottom:15px;"></div>
        
        <p style="text-align:center; font-size:0.8rem; color:#aaa; margin-bottom:10px;">CHOOSE DELIVERY METHOD:</p>
        <button class="btn delivery-box" onclick="setDelivery('Balong’s Rider')">BALONG’S RIDER</button>
        <button class="btn delivery-box" onclick="setDelivery('Lalamove App')">LALAMOVE APP</button>
        <button class="btn delivery-box" onclick="setDelivery('Move-It App')">MOVE-IT APP</button>
        
        <button class="btn" style="background:#444;" onclick="document.getElementById('modal').style.display='none';">EDIT ORDER</button>
    </div>
</div>
